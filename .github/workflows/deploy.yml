name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/api
            git pull origin main
            npm install --omit=dev
            if pm2 describe shelgo-api &>/dev/null; then
              pm2 restart shelgo-api
            else
              pm2 start index.js --name shelgo-api
            fi
            pm2 save
            echo "API deployed successfully"
